<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pobieranie leadów GetBuild.pl</title>
  <style>
    body{font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f4f7fb;margin:0;color:#0a1628}
    main{max-width:560px;background:white;padding:36px;border-radius:18px;box-shadow:0 12px 40px rgba(10,22,40,.12);text-align:center}
    button{border:0;border-radius:10px;padding:14px 22px;background:#2563eb;color:white;font-weight:700;font-size:16px;cursor:pointer}
    p{line-height:1.5;color:#475569}
  </style>
</head>
<body>
<main>
  <h1>Pobieranie listy leadów</h1>
  <p>Pobieranie pliku CSV powinno rozpocząć się automatycznie. Jeśli przeglądarka je zablokuje, kliknij przycisk.</p>
  <button id="download">Pobierz plik CSV</button>
  <p id="status"></p>
</main>
<script>
const source='https://raw.githubusercontent.com/xccssdsdsd-source/Sprz-tanie-biur-nieruchomo-ci/main/leady_nieruchomosci_do_cold_callingu.csv';
async function downloadFile(){
  const status=document.getElementById('status');
  try{
    status.textContent='Przygotowywanie pliku…';
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('Nie udało się pobrać danych');
    const data=await response.blob();
    const blob=new Blob([data],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download='leady_nieruchomosci_do_cold_callingu.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    status.textContent='Plik został przygotowany do pobrania.';
  }catch(error){
    status.textContent='Automatyczne pobieranie nie zadziałało. Kliknij prawym przyciskiem na przycisku i wybierz otwarcie w nowej karcie.';
  }
}
document.getElementById('download').addEventListener('click',downloadFile);
setTimeout(downloadFile,400);
</script>
</body>
</html>
