<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pobierz CSV</title><body style="font-family:Arial;padding:40px"><h1>Leady bez strony — CSV</h1><p>Plik powinien pobrać się automatycznie. Gdyby nie, kliknij przycisk.</p><button id="b" style="font-size:18px;padding:14px 22px">Pobierz CSV</button><p id="s"></p><script>async function d(){try{const r=await fetch('https://raw.githubusercontent.com/xccssdsdsd-source/Sprz-tanie-biur-nieruchomo-ci/main/leady_bez_strony_i_bardzo_slabe_strony.csv',{cache:'no-store'});if(!r.ok)throw new Error();const blob=await r.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='leady_bez_strony_i_bardzo_slabe_strony.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);document.getElementById('s').textContent='Pobieranie rozpoczęte.'}catch(e){document.getElementById('s').textContent='Kliknij przycisk ponownie.'}}document.getElementById('b').onclick=d;setTimeout(d,400)</script></body></html>
